# Generated by `npm run install-voicemail`. Edit the generated wrangler.toml,
# not this file — regenerating overwrites it.
#
# Everything is served from one origin: the Worker hosts the web app as static
# assets alongside the API. That removes GitHub Pages, cross-origin CORS, the
# WebAuthn RP-ID mismatch, and the Pages environment rules from setup — the
# four things most likely to go wrong.

name = "{{WORKER_NAME}}"
main = "src/index.js"
compatibility_date = "2026-01-15"
compatibility_flags = ["nodejs_compat"]

# The built web app. Anything not claimed by the Worker below is served from
# here, with unknown paths falling back to index.html for client-side routing.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API and webhook paths must reach the Worker rather than the asset server.
run_worker_first = ["/api/*", "/auth/*", "/twilio/*", "/greeting.mp3", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "{{D1_NAME}}"
database_id = "{{D1_ID}}"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "{{R2_BUCKET}}"

[triggers]
crons = ["17 4 * * *"]

[vars]
APP_ORIGIN = "{{APP_ORIGIN}}"
APP_BASE_URL = "{{APP_ORIGIN}}"
RP_ID = "{{RP_ID}}"
RP_NAME = "Voicemail"
TRANSCRIBE_PROVIDER = "assemblyai"
TRANSCRIBE_MODEL = "universal-3-5-pro,universal-2"
GREETING_AUDIO = ""
GREETING = "{{GREETING}}"
TRASH_RETENTION_DAYS = "30"
